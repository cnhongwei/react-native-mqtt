plugins { id 'com.android.application' }
android { namespace 'com.cnhongwei.pahoprobe'; compileSdk 36
  defaultConfig { applicationId 'com.cnhongwei.pahoprobe'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0' }
  signingConfigs { debug { storeFile file('../../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
  buildTypes { debug { signingConfig signingConfigs.debug }; release { signingConfig signingConfigs.debug; minifyEnabled true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}
dependencies { implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5' }
